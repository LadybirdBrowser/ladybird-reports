name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ADMIN_DATABASE_URL: postgresql://postgres:reports@localhost:5432/reports
  TEST_ADMIN_DATABASE_URL: postgresql://postgres:reports@localhost:5432/reports

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reports
          POSTGRES_PASSWORD: reports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets

  browser:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reports
          POSTGRES_PASSWORD: reports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESSION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GITHUB_CLIENT_ID: browser-test-client
      GITHUB_CLIENT_SECRET: browser-test-secret
      ATTACHMENT_ROOT: ${{ github.workspace }}/target/browser-test-attachments

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [rust, browser]
    runs-on: ubuntu-24.04
    env:
      COOLIFY_WEBHOOK_URL: ${{ vars.COOLIFY_WEBHOOK_URL }}
      COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}

    steps:
      - name: Trigger Coolify source deployment
        shell: bash
        run: |
          test -n "$COOLIFY_WEBHOOK_URL"
          test -n "$COOLIFY_WEBHOOK_SECRET"

          signature="$(
            python3 - <<'PY'
          import hashlib
          import hmac
          import os
          from pathlib import Path

          payload = Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes()
          secret = os.environ["COOLIFY_WEBHOOK_SECRET"].encode()
          print(hmac.new(secret, payload, hashlib.sha256).hexdigest())
          PY
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Hub-Signature-256: sha256=${signature}" \
            --data-binary "@${GITHUB_EVENT_PATH}" \
            "$COOLIFY_WEBHOOK_URL"
