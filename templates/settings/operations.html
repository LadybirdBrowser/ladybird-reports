{% extends "base.html" %}

{% block title %}Audit log{% endblock %}

{% block content %}

        <div>
            <p class="eyebrow">Accountability</p>
            <h1>Audit log</h1>
            <p class="page-summary">
                Review administrative changes, moderation actions, and GitHub activity.
            </p>
        </div>
    </header>

    <section
        class="card"
        aria-labelledby="operation-list-title"
    >

            <h2 id="operation-list-title">Latest activity</h2>

{% endblock %}
