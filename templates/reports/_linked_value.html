{% match field.link %}{% when FieldLink::UntrustedUrl %}<button class="field-link link-button" type="button" data-untrusted-url="{{ field.value }}">{{ field.value }}</button>{% when FieldLink::Commit(href) %}<a class="field-link" href="{{ href }}">{{ field.value }}</a>{% when FieldLink::None %}{{ field.value }}{% endmatch %}
