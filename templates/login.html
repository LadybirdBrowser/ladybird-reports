{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block anonymous_version %}{{ application_version }}{% endblock %}

{% block content %}
    <div class="login-shell">
        <section class="login-card">
            <div class="login-emblem" aria-hidden="true">
                <img src="/assets/ladybird-mark.png" alt="">
            </div>
            <h1>Welcome to Reports</h1>
            <p>
                Review incoming diagnostics, connect related reports, and coordinate fixes
                with GitHub.
            </p>
            <a class="button" href="{{ github_login_url }}">Continue with GitHub</a>
        </section>
    </div>
{% endblock %}
