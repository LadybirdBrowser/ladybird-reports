{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
    <div class="login-shell">
        <section class="login-card">
            <div class="login-emblem" aria-hidden="true">
                <img src="/assets/ladybird-mark.png" alt="">
            </div>
            <p class="eyebrow">Secure access</p>
            <h1>Welcome to Reports</h1>
            <p>
                Review incoming diagnostics, connect related reports, and coordinate fixes
                with GitHub.
            </p>
            <a class="button" href="/auth/github">Continue with GitHub</a>
        </section>
    </div>
{% endblock %}
